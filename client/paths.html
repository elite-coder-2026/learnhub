<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearnHub — Learning Paths</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700;800&display=swap');

        :root {
            --bg:            #0a0d14;
            --surface:       #111520;
            --card:          #161b2a;
            --card-hover:    #1c2336;
            --border:        #232b42;
            --border-hover:  #3a4470;
            --accent:        #4f6ef7;
            --accent-dim:    rgba(79,110,247,.14);
            --accent-glow:   rgba(79,110,247,.25);
            --success:       #34c97b;
            --success-dim:   rgba(52,201,123,.12);
            --gold:          #f5c542;
            --gold-dim:      rgba(245,197,66,.12);
            --text-primary:  #e8eaf2;
            --text-secondary:#8892b0;
            --text-muted:    #4a5270;
            --font-display:  'Syne', sans-serif;
            --font-body:     'Inter', system-ui, sans-serif;

            --text-xs:   clamp(10px, 0.75vw, 13px);
            --text-sm:   clamp(12px, 0.85vw, 15px);
            --text-base: clamp(13px, 0.95vw, 16px);
            --text-lg:   clamp(15px, 1.1vw,  20px);
            --text-xl:   clamp(18px, 1.5vw,  26px);
            --text-hero: clamp(28px, 3.5vw,  56px);

            --space-xs:  clamp(4px,  0.4vw,  8px);
            --space-sm:  clamp(8px,  0.7vw,  14px);
            --space-md:  clamp(14px, 1.2vw,  24px);
            --space-lg:  clamp(24px, 2vw,    40px);
            --space-xl:  clamp(40px, 4vw,    80px);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --nav-h:     clamp(56px, 5vw, 72px);

            /* Path accent colors */
            --fe-color:  #4f6ef7;
            --fe-dim:    rgba(79,110,247,.14);
            --fe-glow:   rgba(79,110,247,.2);
            --be-color:  #34c97b;
            --be-dim:    rgba(52,201,123,.14);
            --be-glow:   rgba(52,201,123,.2);
            --ml-color:  #f5a623;
            --ml-dim:    rgba(245,166,35,.14);
            --ml-glow:   rgba(245,166,35,.2);
            --fs-color:  #a78bfa;
            --fs-dim:    rgba(167,139,250,.14);
            --fs-glow:   rgba(167,139,250,.2);
        }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            font-family: var(--font-body);
            color: var(--text-primary);
            font-size: var(--text-base);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ── Nav ─────────────────────────────────────────── */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            height: var(--nav-h);
            background: rgba(10,13,20,.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 var(--space-lg);
            gap: var(--space-md);
        }
        .nav-logo {
            font-family: var(--font-display);
            font-size: var(--text-xl);
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            text-decoration: none;
        }
        .nav-logo span { color: var(--accent); }
        .nav-links { display: flex; gap: var(--space-md); margin-left: var(--space-md); }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: var(--text-sm);
            font-weight: 500;
            transition: color .15s;
        }
        .nav-links a:hover,
        .nav-links a.active { color: var(--text-primary); }
        .nav-links a.active { color: var(--accent); }
        .nav-right { margin-left: auto; display: flex; align-items: center; gap: var(--space-sm); }
        .btn {
            font-family: var(--font-body);
            font-size: var(--text-sm);
            font-weight: 600;
            border-radius: var(--radius-sm);
            padding: 8px 18px;
            cursor: pointer;
            border: none;
            transition: opacity .15s, background .15s, border-color .15s, color .15s;
        }
        .btn-ghost {
            background: none;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { border-color: var(--border-hover); color: var(--text-primary); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { opacity: .88; }

        /* ── Page header ─────────────────────────────────── */
        .page-header {
            padding: var(--space-xl) var(--space-lg) var(--space-lg);
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }
        .page-header::before {
            content: '';
            position: absolute;
            top: 0; left: -10%;
            width: 50vw; height: 50vh;
            background: var(--accent-glow);
            filter: blur(100px);
            opacity: .3;
            pointer-events: none;
            border-radius: 50%;
        }

        .page-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-dim);
            border: 1px solid rgba(79,110,247,.3);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: var(--text-xs);
            font-weight: 700;
            color: var(--accent);
            letter-spacing: .06em;
            text-transform: uppercase;
            margin-bottom: var(--space-md);
        }

        .page-title {
            font-family: var(--font-display);
            font-size: var(--text-hero);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.05;
            margin-bottom: var(--space-sm);
            position: relative;
        }
        .page-title em { font-style: normal; color: var(--accent); }

        .page-sub {
            font-size: var(--text-lg);
            color: var(--text-secondary);
            max-width: 560px;
            line-height: 1.6;
            position: relative;
        }

        /* ── Path filter tabs ────────────────────────────── */
        .filter-bar {
            display: flex;
            gap: var(--space-sm);
            padding: var(--space-md) var(--space-lg);
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
        }
        .filter-tab {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 7px 18px;
            font-family: var(--font-body);
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: border-color .15s, color .15s, background .15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .filter-tab:hover { border-color: var(--border-hover); color: var(--text-primary); }
        .filter-tab.active[data-path="all"]      { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
        .filter-tab.active[data-path="frontend"] { background: var(--fe-dim); border-color: var(--fe-color); color: var(--fe-color); }
        .filter-tab.active[data-path="backend"]  { background: var(--be-dim); border-color: var(--be-color); color: var(--be-color); }
        .filter-tab.active[data-path="ml"]       { background: var(--ml-dim); border-color: var(--ml-color); color: var(--ml-color); }
        .filter-tab.active[data-path="fullstack"]{ background: var(--fs-dim); border-color: var(--fs-color); color: var(--fs-color); }

        /* ── Path cards ──────────────────────────────────── */
        .paths-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--space-lg) var(--space-xl);
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
        }

        .path-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: border-color .2s, box-shadow .2s;
        }
        .path-card:hover { border-color: var(--border-hover); }
        .path-card[data-path="frontend"] { --path-color: var(--fe-color); --path-dim: var(--fe-dim); --path-glow: var(--fe-glow); }
        .path-card[data-path="backend"]  { --path-color: var(--be-color); --path-dim: var(--be-dim); --path-glow: var(--be-glow); }
        .path-card[data-path="ml"]       { --path-color: var(--ml-color); --path-dim: var(--ml-dim); --path-glow: var(--ml-glow); }
        .path-card[data-path="fullstack"]{ --path-color: var(--fs-color); --path-dim: var(--fs-dim); --path-glow: var(--fs-glow); }

        .path-card:hover { box-shadow: 0 8px 40px var(--path-glow); border-color: var(--path-color); }

        /* Color bar across top */
        .path-bar {
            height: 4px;
            background: var(--path-color);
            opacity: .7;
        }

        .path-header {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: var(--space-md);
            align-items: center;
            padding: var(--space-lg);
            cursor: pointer;
        }

        .path-icon {
            width: clamp(52px, 5vw, 72px);
            height: clamp(52px, 5vw, 72px);
            border-radius: var(--radius-md);
            background: var(--path-dim);
            border: 1px solid var(--path-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(22px, 2.5vw, 34px);
            flex-shrink: 0;
        }

        .path-meta { min-width: 0; }

        .path-tag {
            font-size: var(--text-xs);
            font-weight: 700;
            color: var(--path-color);
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: 4px;
        }

        .path-name {
            font-family: var(--font-display);
            font-size: var(--text-xl);
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 6px;
        }

        .path-desc {
            font-size: var(--text-sm);
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .path-stats {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: var(--space-xs);
            flex-shrink: 0;
        }

        .path-stat-row {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .path-stat {
            text-align: center;
        }
        .path-stat-val {
            font-family: var(--font-display);
            font-size: var(--text-lg);
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1;
        }
        .path-stat-lbl {
            font-size: var(--text-xs);
            color: var(--text-muted);
            margin-top: 2px;
        }

        .path-expand-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: var(--text-xs);
            font-weight: 600;
            padding: 6px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: border-color .15s, color .15s;
            white-space: nowrap;
            margin-top: var(--space-xs);
        }
        .path-expand-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }
        .chevron { transition: transform .25s; display: inline-block; }
        .path-card.open .chevron { transform: rotate(180deg); }

        /* Skills tags */
        .path-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0 var(--space-lg) var(--space-md);
        }
        .skill-tag {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3px 10px;
            font-size: var(--text-xs);
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* ── Course list (expanded) ───────────────────────── */
        .path-courses {
            border-top: 1px solid var(--border);
            overflow: hidden;
            max-height: 0;
            transition: max-height .35s ease;
        }
        .path-card.open .path-courses { max-height: 1200px; }

        .path-courses-inner {
            padding: var(--space-md) var(--space-lg) var(--space-lg);
        }

        .courses-label {
            font-size: var(--text-xs);
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .1em;
            margin-bottom: var(--space-md);
        }

        .course-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .course-row {
            display: grid;
            grid-template-columns: 32px 1fr auto auto;
            align-items: center;
            gap: var(--space-md);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background .15s;
        }
        .course-row:hover { background: var(--card-hover); }

        .course-step {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--path-dim);
            border: 1px solid var(--path-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-xs);
            font-weight: 700;
            color: var(--path-color);
            flex-shrink: 0;
        }
        .course-step.done {
            background: var(--path-color);
            color: #fff;
            border-color: var(--path-color);
        }

        .course-row-title {
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--text-primary);
        }
        .course-row-sub {
            font-size: var(--text-xs);
            color: var(--text-muted);
            margin-top: 1px;
        }

        .course-row-duration {
            font-size: var(--text-xs);
            color: var(--text-muted);
            white-space: nowrap;
        }

        .course-row-badge {
            font-size: var(--text-xs);
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }
        .badge-start    { background: var(--path-dim); color: var(--path-color); }
        .badge-locked   { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); }
        .badge-new      { background: var(--accent-dim); color: var(--accent); }

        .path-cta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: var(--space-lg);
            padding-top: var(--space-md);
            border-top: 1px solid var(--border);
            gap: var(--space-md);
            flex-wrap: wrap;
        }
        .path-cta-text {
            font-size: var(--text-sm);
            color: var(--text-secondary);
        }
        .path-cta-text strong { color: var(--text-primary); }

        /* ── Progress bar ────────────────────────────────── */
        .progress-wrap {
            background: var(--surface);
            border-radius: 4px;
            height: 6px;
            overflow: hidden;
            margin-top: var(--space-xs);
            width: 120px;
        }
        .progress-fill {
            height: 100%;
            background: var(--path-color);
            border-radius: 4px;
            transition: width .5s ease;
        }

        /* ── Responsive ──────────────────────────────────── */
        @media (max-width: 900px) {
            .path-header { grid-template-columns: auto 1fr; }
            .path-stats  { display: none; }
            .nav-links   { display: none; }
            .course-row  { grid-template-columns: 32px 1fr auto; }
            .course-row-badge { display: none; }
        }
        @media (max-width: 520px) {
            .path-header { grid-template-columns: 1fr; }
            .path-icon   { display: none; }
        }
        @media (hover: none) and (pointer: coarse) {
            .btn { min-height: 44px; }
            .course-row { padding: var(--space-md); }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; animation: none !important; }
        }
    </style>
</head>

                { title: 'Auth from Scratch — JWT & Sessions', sub: 'Full-stack auth end-to-end', duration: '3.8 hr', badge: 'new' },
                { title: 'Advanced React Patterns', sub: 'Compound · Render Props · HOC', duration: '6.5 hr', badge: 'locked' },
                { title: 'REST API Design Principles', sub: 'Versioning · Pagination · Rate Limiting', duration: '4.1 hr', badge: 'locked' },
                { title: 'Docker & CI/CD for Node Apps', sub: 'Containerize and deploy your app', duration: '5.1 hr', badge: 'locked' },
                { title: 'Capstone — Ship a Full-Stack SaaS', sub: 'End-to-end project with code review', duration: '8.0 hr', badge: 'locked' },
            ],
        },
    ];

    const badgeLabel = { start: 'Start here', locked: 'Locked', new: 'New' };

    const renderPath = (p) => `
    <div class="path-card" data-path="${p.id}" id="path-${p.id}">
      <div class="path-bar"></div>
      <div class="path-header" onclick="togglePath('${p.id}')">
        <div class="path-icon">${p.icon}</div>
        <div class="path-meta">
          <div class="path-tag">${p.tag}</div>
          <div class="path-name">${p.name}</div>
          <div class="path-desc">${p.desc}</div>
        </div>
        <div class="path-stats">
          <div class="path-stat-row">
            <div class="path-stat">
              <div class="path-stat-val">${p.stats.courses}</div>
              <div class="path-stat-lbl">Courses</div>
            </div>
            <div class="path-stat">
              <div class="path-stat-val">${p.stats.hours}h</div>
              <div class="path-stat-lbl">Total</div>
            </div>
            <div class="path-stat">
              <div class="path-stat-val">${p.stats.students}</div>
              <div class="path-stat-lbl">Students</div>
            </div>
          </div>
          <button class="path-expand-btn">
            View path <span class="chevron">▾</span>
          </button>
        </div>
      </div>

      <div class="path-skills">
        ${p.skills.map(s => `<div class="skill-tag">${s}</div>`).join('')}
      </div>

      <div class="path-courses">
        <div class="path-courses-inner">
          <div class="courses-label">Course sequence — ${p.courses.length} courses</div>
          <div class="course-list">
            ${p.courses.map((c, i) => `
              <div class="course-row">
                <div class="course-step ${c.badge === 'start' ? 'done' : ''}">${i + 1}</div>
                <div>
                  <div class="course-row-title">${c.title}</div>
                  <div class="course-row-sub">${c.sub}</div>
                </div>
                <div class="course-row-duration">⏱ ${c.duration}</div>
                <div class="course-row-badge badge-${c.badge}">${badgeLabel[c.badge]}</div>
              </div>`).join('')}
          </div>
          <div class="path-cta">
            <div class="path-cta-text">
              <strong>${p.stats.courses} courses · ${p.stats.hours} hours</strong> · Start anytime, go at your own pace.
            </div>
            <button class="btn btn-primary" style="padding:10px 24px;">Start this path</button>
          </div>
        </div>
      </div>
    </div>`;

    const container = document.getElementById('paths-container');

    const renderAll = (filter) => {
        const filtered = filter === 'all' ? PATHS : PATHS.filter(p => p.id === filter);
        container.innerHTML = filtered.map(renderPath).join('');
        // Auto-expand if only one showing
        if (filtered.length === 1) togglePath(filtered[0].id);
    };

    const togglePath = (id) => {
        const card = document.getElementById(`path-${id}`);
        if (!card) return;
        card.classList.toggle('open');
    };

    // Filter tabs
    document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            renderAll(tab.dataset.path);
        });
    });

    renderAll('all');
</script>
</body>
</html>
